name: Go CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 必须加上这个权限，允许 GitHub Actions 帮你把镜像推送到 GHCR (GitHub Container Registry)
permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run Unit Tests
        run: go test -v -race ./...

      # 以下是新增的 CD 部分：登录、构建并推送镜像
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. 构建并推送 Go 网关镜像
      - name: Build and push Go Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 镜像地址：ghcr.io/你的GitHub用户名/ai-inference-gateway/go-gateway:latest
          tags: ghcr.io/${{ github.repository }}/go-gateway:latest

      # 2. 构建并推送 Python 模型镜像
      - name: Build and push Python Service
        uses: docker/build-push-action@v5
        with:
          context: ./python-service
          file: ./python-service/Dockerfile
          push: true
          # 镜像地址：ghcr.io/你的GitHub用户名/ai-inference-gateway/python-service:latest
          tags: ghcr.io/${{ github.repository }}/python-service:latest