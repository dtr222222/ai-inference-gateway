services:
  ai_probe:
    build: .
    ports:
      - "8000:8080"
    environment:
      - TIMEOUT_SECONDS=10
      - CONCURRENCY=2
      # 注意这里得换成 mysql 的端口
      - DB_DSN=root:123456@tcp(mysql:3306)/ai_probe?charset=utf8mb4&parseTime=True&loc=Local
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ai_probe
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      # 把声明的卷挂载到这里
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 下面的 127.0.0.1 不能换成 localhost，127.0.0.1 能够强制走 tcp 协议，避免 ai_probe 在数据库之前启动
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1" ]
      interval: 10s     # 每 10s 探测一次
      timeout: 5s       # 单次探测超过 5s 算失败
      retries: 5        # 连续失败 5 次才算不健康
      start_period: 30s # 容器刚启动时，先给 30 秒缓冲期，不算失败

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "9090:9090"
    depends_on:
      ai_probe:
        condition: service_started
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      prometheus:
        condition: service_started
    volumes:
      - grafana_data:/var/lib/grafana


volumes:
  # 告诉 Docker Compose：“我要创建一个名叫 mysql_data 的持久化数据卷。”
  # mysql_data 是一个 Docker 命名卷，本质是 Docker 在 WSL2 里托管的一个目录，里面装着 MySQL 的数据文件。
  # 它不是文件，不能被 Windows 文件资源管理器直接打开。想访问数据，用数据库工具连上去就行。
  # MySQL 数据存在这里
  mysql_data:
  prometheus_data:
  grafana_data: