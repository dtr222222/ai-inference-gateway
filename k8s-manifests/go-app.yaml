apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-app
  template:
    metadata:
      labels:
        app: go-app
    spec:
      containers:
        - name: go-container
          image: ai-gateway-go:v2.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: LIMIT
              value: "60"
            - name: WINDOW
              value: "60"

          # 可优化的点：将 cpu 指标换成 prometheus 里监控的 batchQueueSize
          # 因为 go 服务端本质上只是一个网关，对 cpu 要求不高，cpu 指标不太适用
          resources:
            limits:
              cpu: 500m
            requests:
              cpu: 100m
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: go-service
spec:
  type: LoadBalancer
  selector:
    app: go-app
  ports:
    - port: 8080
      targetPort: 8080