apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-app
  template:
    metadata:
      labels:
        app: go-app
    spec:
      containers:
        - name: go-container
          image: ai-gateway-go:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080