apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
        - name: python-container
          image: ai-gateway-python:v1.0.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
          env:
            - name: HF_ENDPOINT
              value: https://hf-mirror.com
            # 限制多线程，与 pytorch 底层相关
            - name: OMP_NUM_THREADS
              value: "2"
          resources:
            limits:
              cpu: 1500m
            requests:
              cpu: 1000m
          startupProbe:
            # 把 httpGet 全换成 Socket
            # 为什么不再用 httpGet, 因为 httpGet会发普通 HTTP 文本，
            # 而换了 gRPC 后传的是 proto 的二进制文本，httpGet发的非二进制文本，gPRC解析不了，
            # 会使得探针报错或挂起

            # 这里换成 tcpSocket
            # 是什么：最底层的网络协议———— tcp
            # 方式：直接对 Pod 的 50051 端口发起一次 TCP 三次握手
            # 如果端口在监听，握手成功，否则失败
            tcpSocket:
              port: 50051
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            periodSeconds: 30
            failureThreshold: 10
          readinessProbe:
            tcpSocket:
              port: 50051
            periodSeconds: 5
---

apiVersion: v1
kind: Service
metadata:
  name: python-service
spec:
  # 变成无头服务
  clusterIP: None
  type: ClusterIP
  selector:
    app: python-app
  ports:
    - port: 50051
      targetPort: 50051