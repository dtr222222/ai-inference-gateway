apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
        - name: python-container
          image: ai-gateway-python:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: HF_ENDPOINT
              value: https://hf-mirror.com
          resources:
            limits:
              cpu: 2000m
            requests:
              cpu: 200m
          startupProbe:
            httpGet:
              path: /docs
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            periodSeconds: 30
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: python-service
spec:
  type: ClusterIP
  selector:
    app: python-app
  ports:
    - port: 8000
      targetPort: 8000